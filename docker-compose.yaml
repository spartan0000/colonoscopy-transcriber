services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
      
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  colonoscopy-transcription:
    build: .
    ports: 
      - "8000:8000"
    depends_on:
      - postgres
    env_file:
    - .env
    

volumes:
  pgdata:

